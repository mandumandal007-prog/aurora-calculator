name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install || npm install --legacy-peer-deps

      - name: Expo prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/aurora-calculator.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-calculator-apk
          path: out/aurora-calculator.apk
          if-no-files-found: error
